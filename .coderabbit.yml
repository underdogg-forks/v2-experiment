# =======================================================
#  CodeRabbit AI Review Configuration
#  For Laravel + JS projects
#  Reference: https://docs.coderabbit.ai/config
# =======================================================

language: en-US

reviews:
  # Only review PHP files; exclude markdown, lock files, and package manifests
  path_filters:
    - "**/*.php"
    - "!**/*.md"
    - "!**/package.json"
    - "!**/yarn.lock"
    # --- ignored files -----------------------------------------------------------
    - "!.claude/skills/tailwindcss-development/SKILL.md"
    - "!.coderabbit.yml"
    - "!.env.example"
    - "!.env.testing.example"
    - "!.github/scripts/parse-phpstan-results.php"
    - "!.github/workflows/phpstan.yml"
    - "!.github/workflows/pint.yml"
    - "!.gitignore"
    - "!.mcp.json"
    - "!CLAUDE.md"
    - "!Makefile"
    - "!env.example.txt"
    - "!package.json"
    - "!phpstan.neon"
    - "!phpunit.xml"
    - "!rector.php"
    - "!resources/css/app.css"
    - "!resources/css/filament/admin/nord.css"
    - "!resources/css/filament/company/nord.css"
    - "!resources/views/filament/company/widgets/switch-company-table.blade.php"
    - "!vite.config.js"
    # -----------------------------------------------------------------------------

  path_instructions:
    - path: "Modules/**"
      instructions: >
        This project uses a modular architecture under Modules/*.
        Each module lives in Modules/<name>/ and follows this layout:
          src/Models/        — Eloquent models (namespace Modules\<Name>\Models)
          src/Filament/Resources/<Group>/  — Filament v5 CRUD resources;
            each Resource delegates form/table to Schemas/ and Tables/ classes
          src/Services/      — Service classes
          src/Providers/     — Laravel ServiceProvider
          src/Enums/         — PHP 8.1 backed enums (core module only)
          src/Contracts/     — Interfaces (core module only)
          database/factories/ — Eloquent factories (namespace Modules\<Name>\Database\Factories)
          database/migrations/ — module-scoped migrations
          tests/Feature/     — PHPUnit feature tests using #[Test] and #[Group] attributes

        Key conventions:
        - Namespaces follow PSR-4: Modules\<Name>\* mapped from Modules/<name>/src/
        - Models use cross-module fully-qualified use statements (no App\Models imports)
        - Filament Resources must delegate form() to a *Form class and table() to a *Table class
        - No inline form/table definitions inside the Resource class itself
        - All PHP files must pass php -l and vendor/bin/pint --dirty
        - All new models should have a corresponding factory in database/factories/

    - path: "app/**"
      instructions: >
        The app/ directory is intentionally minimal — only framework bootstrap
        files remain here. Almost all business logic lives in Modules/*.
        Flag any new models, Enums, or Filament Resources added directly to app/
        as misplaced; they belong in the appropriate Modules/<name>/ directory.

    - path: "Modules/*/tests/**"
      instructions: >
        Feature tests use PHPUnit with Pest-compatible #[Test] and #[Group] attributes.
        Tests must authenticate a Modules\Core\Models\User and attach a
        Modules\Core\Models\Company tenant before exercising Filament resources.
        Use RefreshDatabase. Factories live in Modules\<Name>\Database\Factories\.

  # Review tone — defines style of feedback
  # Options: assertive | chill | friendly | strict | concise | detailed
  profile: assertive

  # Require resolution before merge
  request_changes_workflow: true

  # Include an AI summary of the PR
  high_level_summary: false

  # Report check status to GitHub UI
  review_status: false
  commit_status: false
  fail_commit_status: false

  # --- collapsible: UI / Fun / Optional ------------------------------------------------
  collapse_walkthrough: false
  sequence_diagrams: false
  estimate_code_review_effort: true
  in_progress_fortune: false
  poem: false
  # ------------------------------------------------------------------------------------

  auto_review:
    enabled: false
    auto_incremental_review: true
    # --- collapsible: customization ----------------------------------------------------
    ignore_title_keywords: ['WIP', 'draft']
    labels: ['needs-review']
    drafts: false
    base_branches: ['master', 'development']
    ignore_usernames: ['dependabot', 'renovate']
    # ------------------------------------------------------------------------------------

  # --- collapsible: doc/test auto-suggestions ------------------------------------------
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  # ------------------------------------------------------------------------------------

  # --- collapsible: pre-merge quality gates --------------------------------------------
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: 'Descriptive, mentions component or ticket'
    description:
      mode: warning
  # ------------------------------------------------------------------------------------

tools:
  # --- Core linters for Laravel (PHP) and JS -------------------------------------------
  phpstan:
    enabled: true
    level: "3"
  phpcs:
    enabled: true
  eslint:
    enabled: true
  markdownlint:
    enabled: true

  # --- collapsible: supporting & infra tools -------------------------------------------
  shellcheck:
    enabled: false
  hadolint:
    enabled: false
  yamllint:
    enabled: false
  dotenvLint:
    enabled: false
  htmlhint:
    enabled: false
  semgrep:
    enabled: false
  gitleaks:
    enabled: false
  osvScanner:
    enabled: false
  actionlint:
    enabled: true
  # ------------------------------------------------------------------------------------

chat:
  # --- collapsible: personality + integrations -----------------------------------------
  art: false
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled
  # ------------------------------------------------------------------------------------

# --- collapsible: AI learning + docs integration ---------------------------------------
knowledge_base:
  opt_out: true
  web_search:
    enabled: false
  code_guidelines:
    enabled: false
    filePatterns: ['CONTRIBUTING.md', 'docs/code-guidelines.md']
  learnings:
    scope: global
  issues:
    scope: global
  pull_requests:
    scope: global
# ---------------------------------------------------------------------------------------

# --- collapsible: AI code generation suggestions ---------------------------------------
code_generation:
  docstrings:
    language: en-US

  unit_tests:
    path_instructions:
      - path: 'Modules/*/tests/Unit/**'
        instructions: |
          Each test method must begin with `it_` and is in snake_case.
          Annotate each test method with `#[Test]`.
          Each test method must contain `$this->markTestIncomplete();` by default.
          Prefer Fakes and Fixtures over Mocks.
          Structure tests with `it_` functions and place happy paths last.
          Reusable logic (e.g., fixtures) must reside in an abstract test case.
      - path: 'Modules/*/tests/Feature/**'
        instructions: |
          Each test method must begin with `it_` and is in snake_case.
          Annotate each test method with `#[Test]`.
          Default to `$this->markTestIncomplete();` until test logic is finalized.
          Use RefreshDatabase and authenticate via Modules\Core\Models\User::factory().
          Avoid inline fixture setup; use factories and seeders.
      - path: 'tests/Unit/**'
        instructions: |
          Each test method must begin with `it_` and is in snake_case.
          Annotate each test method with `#[Test]`.
          Each test method must contain `$this->markTestIncomplete();` by default.
          Prefer Fakes and Fixtures over Mocks.
      - path: 'tests/Feature/**'
        instructions: |
          Each test method must begin with `it_` and is in snake_case.
          Annotate each test method with `#[Test]`.
          Default to `$this->markTestIncomplete();` until test logic is finalized.
          Use Laravel's HTTP helpers (`->postJson()`, `->getJson()`, etc.).
          Avoid inline fixture setup; use factories and seeders.
# ---------------------------------------------------------------------------------------
